# ubuntu · Electron 44 CI（R159.3 起）——真实时钟权威端
#
# 定位：**真实时钟**（无 --virtual-time-budget）——V8 浏览器腿上时序敏感的页
# （builtindemo 动画收口/边界摩擦、imageext/measimage 真图像解码）在本端是
# 权威验证（教义「性能/时序权威在 Electron」，R159.3 八跑后裁定落地）。
#
# 版本：Electron 44.2.0（与本地 electron/runtime/ 解包版一致）；
# Node 24/26 矩阵只影响 harness 工具链（extract/守门），Electron 自带
# 独立 Node 运行主进程。
#
# 显示：runner 无 X——xvfb-run 提供 X11（run.sh 的 --ozone-platform=x11 需要），
# ARKUI_OFFSCREEN=1（脚本默认）用 paint 帧截图，不依赖合成器产帧。

name: "ubuntu · Electron 44（真实时钟 · 97 用例 + 断言计数守门）"

on:
  workflow_call:
    inputs:
      # runner 镜像（U26 迁移机制：默认钉 24.04 行为不变；caller 显式传
      # ubuntu-26.04 逐腿迁移——探针实测见代码仓 ubuntu26-probe.yml）
      runner:
        type: string
        default: "ubuntu-24.04"
      node-version:
        type: string
        default: "24"

permissions:
  contents: read


jobs:
  electron:
    name: electron (node ${{ inputs.node-version }})
    runs-on: ${{ inputs.runner }}   # 默认 24.04（U26 迁移经 caller runner input 逐腿切）
    timeout-minutes: 60
    # 不设内部 matrix：matrix.node 在 steps 里从未被消费（内部矩阵×caller 外部矩阵
    # =纯 2×2 重复四腿，双倍分钟烧同两个结果——Windows 接线日实证），harness node
    # 由 caller 的 inputs.node-version 决定
    env:
      NODE: node
      ELECTRON: ${{ github.workspace }}/electron/node_modules/electron/dist/electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: 系统依赖（Electron 运行库 + 字体对齐 + metacity 窗管 + xvfb）
        run: |
          sudo apt-get update -qq
          # fonts：textmeasure 换行/行高断言按本地字体度量冻结（同 browser 腿）
          # metacity：xvfb 无窗管时 Electron fullscreen/maximize 语义缺失（九跑实证）；
          #   openbox 的 restore 不还原宽度（十六跑实证）——GNOME 系 metacity 与本地一致
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core metacity libnss3 libasound2t64 libgbm1 xvfb
      - name: 安装 Electron 44.2.0（与本地 electron/runtime/ 同版本；zip 带重试）
        run: |
          cd electron
          npm install --no-save electron@44.2.0
          # R161 实录：install.js 内部走 @electron/get 下载无重试——GitHub Releases
          # 一次 502 整腿即红（CI electron node26 实锤）。预热趟 curl --retry 先落
          # zip；install.js 失败时直接解包（zip 布局=dist 根，与 install.js 同产物）。
          f="$HOME/.cache/electron-prewarm/electron-v44.2.0-linux-x64.zip"
          if [ ! -s "$f" ]; then
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 --retry-delay 5 -o "$f" \
              https://github.com/electron/electron/releases/download/v44.2.0/electron-v44.2.0-linux-x64.zip
          fi
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "postinstall 未产出二进制——手动触发 install.js"
            node node_modules/electron/install.js || true
          fi
          if [ ! -x node_modules/electron/dist/electron ] && [ -s "$f" ]; then
            echo "install.js 后仍缺（或其下载 5xx）——预热 zip 直接解包到 dist"
            rm -rf node_modules/electron/dist
            mkdir -p node_modules/electron/dist
            unzip -q -o "$f" -d node_modules/electron/dist
          fi
          test -x node_modules/electron/dist/electron || { echo "❌ electron 二进制未就位"; exit 1; }
          # --no-sandbox 必带：runner 上 chrome-sandbox 非 root:4755 会 FATAL（run.sh 同款）
          ./node_modules/electron/dist/electron --version --no-sandbox
      # 弃用 GabrielBB/xvfb-action（node20 已废弃警告 + run 只取首行/无引号解析
      # 两个实测约束）——改手动 xvfb-run：全参数自主、编排全在
      # .github/scripts/electron-xvfb-run.sh（metacity 窗管先起、run.sh all 随后）
      - name: electron/run.sh all（97 用例 + 断言计数守门，xvfb + metacity 真实时钟）
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bash .github/scripts/electron-xvfb-run.sh
      - name: 失败留档（截图 + 计数表）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: electron-logs-node${{ inputs.node-version }}
          path: |
            build/electron-*.png
            build/assert-counts-electron.tsv
          if-no-files-found: ignore
          retention-days: 7
