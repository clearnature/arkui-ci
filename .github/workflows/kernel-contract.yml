name: "kernel · 内核运行时契约（冻结 .so 直载）"

on:
  workflow_call:
    inputs:
      # runner 镜像（U26 迁移完成 2026-10-08：默认钉 26.04——caller 显式传参
      # 可逐腿覆盖；探针/六腿验证见代码仓 ubuntu26-probe/ubuntu26-validate）
      runner:
        type: string
        default: "ubuntu-26.04"
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  contract:
    name: contract (node ${{ inputs.node-version }})
    runs-on: ${{ inputs.runner }}   # 默认 26.04（U26 迁移完成 2026-10-08；caller runner input 可逐腿覆盖）
    timeout-minutes: 15
    # 不设内部 matrix：matrix.node 从未被消费（setup-node 吃的是 inputs.node-version，
    # 两腿逐字节相同白烧一条——electron-realtime 同病 PR#3 先例）；kernel 契约对
    # harness node 版本不敏感，caller 传多少就是多少
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: 内核 .so 在位确认
        run: |
          for k in c-sample/libkernel_c.so go/libkernel_go.so rust/libkernel_rs.so; do
            test -s "kernel/$k" || { echo "❌ 缺 kernel/$k"; exit 1; }
          done
          echo "✅ 直载内核 .so 齐备（cangjie/hs 运行时 SKIP 留痕属预期）"
      - name: 内核统一契约（41 断言 × c/go/rs 直载；cangjie/hs SKIP 留痕；退出码=守门）
        run: bash kernel/run-contract.sh all
