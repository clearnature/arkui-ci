# 临时校验器：验证 webkit-matrix reusable 定义可被 GitHub 解析（验证后删除）
name: "validate · webkit-matrix"
on:
  workflow_dispatch:
    inputs:
      node-version:
        type: string
        default: "24"
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/webkit-matrix.yml
    with:
      node-version: ${{ inputs.node-version }}
