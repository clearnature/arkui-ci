# selftest：本仓 push 时跑一份轻量 reusable——证明治理仓的 workflow 定义
# 可解析可执行（定义期错误在本仓暴露，不污染代码仓的 CI）。
# 注意：重 reusable（kernel/browser 等）依赖【代码仓】的 checkout 与产物，
# 不在本仓自测——它们的真实验证发生在代码仓的薄委托调用里。
name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sanity:
    uses: ./.github/workflows/sanity.yml
