name: "nodejs · V8 工具链快检"

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  toolchain:
    name: toolchain (node ${{ inputs.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Node 版本
        run: node --version
      - name: build-runtime 产物一致性（拼接产物逐字节一致）
        run: node tools/build-runtime.mjs --check
      - name: extract 冒烟（Index → build/app.js）
        run: |
          mkdir -p build
          node tools/extract.mjs fixtures/pages/Index.ts build/app.js
          # 类型残留由 extract.mjs 自检（run_one 每例都打印「类型残留: ✅ 无」）
