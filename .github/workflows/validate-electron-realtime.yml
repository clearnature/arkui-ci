# 临时校验器：验证 electron-realtime reusable 定义可被 GitHub 解析（验证后删除）
name: "validate · electron-realtime"
on:
  workflow_dispatch:
    inputs:
      node-version:
        type: string
        default: "24"
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/electron-realtime.yml
    with:
      node-version: ${{ inputs.node-version }}
