# ubuntu · WebKit CI（R159.3 起）——第四引擎（WebKitGTK via playwright）
#
# 与本地 webkit/run.sh 同一驱动：playwright WebKitGTK + #result 单通道判定
# （坑 115：title 快通道会带走陈旧快照）+ assert-overrides 分端差异
# （realfs OPFS 探测 20/21 两态皆合法）。真实时钟——无虚拟时间豁免页。
# playwright 版本钉 1.63.0（与本地 wk-venv 同版，WebKit 构建一致）。

name: "ubuntu · WebKit · 全矩阵 87 用例"

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "26"

permissions:
  contents: read


jobs:
  webkit:
    name: webkit (node ${{ inputs.node-version }})
    runs-on: ubuntu-26.04   # U26 迁移完成（2026-10-08；原钉 24.04 同家族裁定已过期）
    timeout-minutes: 60
    env:
      NODE: node
      WK_PYTHON: python3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: 工具链基线（pnpm 12 + TypeScript 7.1）
        run: |
          npm i -g --allow-scripts=pnpm pnpm@12.18.0 typescript@7.1.0-beta
          echo "node $(node -v) | pnpm $(pnpm -v) | tsc $(tsc -v)"
          # 供项目侧定位 TS 7：Windows 上 npm 是 .cmd 垫片，脚本里 spawn 可能探不到，
          # 所以把路径显式交给后续 step（GitHub 会把它注入该 job 后续步骤的环境）
          echo "TSC7_PKG=$(npm root -g)/typescript" >> "$GITHUB_ENV"
      - name: Python + playwright + WebKitGTK（版本钉 1.63.0=本地同款）
        run: |
          python3 -m pip install --user --break-system-packages playwright==1.63.0
          python3 -m playwright install --with-deps webkit
          python3 -c "from playwright.sync_api import sync_playwright; print('playwright ✅')"
      - name: 字体对齐（textmeasure 度量，同 browser 腿）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core
      - name: webkit/run.sh all（87 用例 + 断言计数守门，overrides 分端差异）
        env:
          WK_PYTHON: python3
        run: bash webkit/run.sh all
      - name: 失败留档（计数表 + 矩阵日志）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: webkit-logs-node${{ matrix.node }}
          path: |
            build/assert-counts-webkit.tsv
            build/wk-matrix.log
          if-no-files-found: ignore
          retention-days: 7
