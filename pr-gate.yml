name: "pr-gate · PR 前置门（声明检查 + 快检）"

on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: true
      pr-body:
        type: string
        required: false

permissions:
  contents: read

jobs:
  pr-body:
    name: PR 声明三要素（变更说明/风险/验证）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检查 PR body 携带三要素声明
        env:
          BODY: ${{ inputs.pr-body }}
        run: |
          miss=""
          for k in 变更说明 风险 验证; do
            case "$BODY" in *"$k"*) ;; *) miss="$miss $k" ;; esac
          done
          if [ -n "$miss" ]; then
            echo "❌ PR body 缺少声明要素：$miss"
            echo "   模板（三节标题缺一不可，内容自拟）："
            echo "   ## 变更说明 —— 改了什么"
            echo "   ## 风险与影响面 —— 可能破坏什么"
            echo "   ## 验证 —— 怎么证明没破坏（本地命令+结果）"
            exit 1
          fi
          echo "✅ 三要素声明齐备"

  fast:
    name: 快检 (node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: build-runtime 产物一致性
        run: node tools/build-runtime.mjs --check
      - name: 内核 .so 在位确认（5 内核全量）
        run: |
          for k in c-sample/libkernel_c.so cangjie/libkernel.so go/libkernel_go.so hs/libkernel_hs.so rust/libkernel_rs.so; do
            test -s "kernel/$k" || { echo "❌ 缺 kernel/$k"; exit 1; }
          done
          echo "✅ 5 内核 .so 齐备"
      - name: Index 抽取冒烟
        run: |
          mkdir -p build
          node tools/extract.mjs fixtures/pages/Index.ts build/app.js
